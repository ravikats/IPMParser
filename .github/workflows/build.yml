name: Build ipm-watch

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build binary (RHEL 8 / glibc 2.28 compatible)
        run: |
          docker run --rm -u root \
            -v "$PWD":/src -w /src \
            registry.access.redhat.com/ubi8/python-311:latest \
            bash -c "python -m pip install --upgrade pip pyinstaller && \
              pyinstaller --onefile --name ipm-watch \
                --add-data metadata:metadata watch_ipm.py"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipm-watch-linux
          path: dist/ipm-watch

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ipm-watch